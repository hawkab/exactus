name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        install: [".[dev]", ".[server,test,dev]"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "${{ matrix.install }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: python tools/validate_sources.py
      - run: python -m unittest discover -s tests -t .
      - run: python -m build
      - run: python benchmarks/bench_compute.py 2
      - run: python benchmarks/bench_predict.py
      - run: python benchmarks/bench_live.py --dry-run --n 2 --runs 1
      - run: python benchmarks/bench_agent_graph.py --arm baseline=raw@http://127.0.0.1:18001 --arm exact=native@http://127.0.0.1:18001 --model smoke --dry-run
